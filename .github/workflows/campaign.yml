# The core evaluation campaign in QEMU (docs/methodology/stage2/
# 20261119-evaluation-campaign/): every case of a cases file through
# tools/campaign/run_case.py, sharded across jobs, then tools/campaign/
# score.py into the run's summary. On demand only. With `sealed`, the
# cases come from the owner's sealed archive (step C3, c3/README.md):
# unseal.py checks it against the committed hash in each job before any
# case, the logs carry verdicts only, and only the case files are uploaded.
name: campaign

on:
  workflow_dispatch:
    inputs:
      cases:
        description: Cases file (haven-campaign-cases/1) in the repository
        required: true
        default: tools/campaign/cases/k3-k4.json
      shards:
        description: Number of parallel jobs
        required: true
        default: "2"
      scenario:
        description: "boot: one boot of the bare test guests (scenario 1); linux2: Linux in A with two vCPUs (s2/README.md); grant2: scenario 1 with grant 2 (s3/README.md)"
        type: choice
        options: [boot, linux2, grant2]
        default: boot
      sealed:
        description: Hash file of a sealed archive (step C3); when set, cases is ignored
        required: false
        default: ""
      sealed_source:
        description: Where the sealed archive's base64 comes from (test is row K7's committed archive)
        type: choice
        options: [secret, test]
        default: secret

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - name: Open the sealed archive (step C3)
        if: inputs.sealed != ''
        env:
          SEALED: ${{ inputs.sealed }}
          SEALED_SOURCE: ${{ inputs.sealed_source }}
          SEALED_ARCHIVE: ${{ secrets.HELDOUT_ARCHIVE_B64 }}
        run: |
          if [ "$SEALED_SOURCE" = test ]; then
            python3 tools/campaign/unseal.py "$SEALED" /tmp/sealed --from-file tools/campaign/cases/k7/test-archive.b64
          else
            python3 tools/campaign/unseal.py "$SEALED" /tmp/sealed --from-env SEALED_ARCHIVE
          fi
      - id: plan
        env:
          CASES: ${{ inputs.sealed != '' && '/tmp/sealed/cases.json' || inputs.cases }}
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 - <<'EOF'
          import json, os
          d = json.load(open(os.environ["CASES"]))
          assert d["schema"] == "haven-campaign-cases/1", "not a cases file"
          n = max(1, min(int(os.environ["SHARDS"]), len(d["cases"])))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"shards={json.dumps(list(range(n)))}\n")
          print(len(d["cases"]), "cases in", n, "shards")
          EOF

  run:
    needs: plan
    if: inputs.scenario == 'boot' || inputs.scenario == 'grant2'
    name: cases shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # amendment 3: Debian trixie's QEMU, newer than Ubuntu 24.04's 8.2.2,
    # which has no SMMU stage 2 (HAVEN then withholds the DMA grant)
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Install git, toolchains, QEMU and dtc
        run: |
          apt-get -o Acquire::Retries=5 update -qq
          apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends \
            git ca-certificates python3 patch make cmake ninja-build gcc libc6-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm device-tree-compiler
      - uses: actions/checkout@v4
      - name: Open the sealed archive (step C3)
        if: inputs.sealed != ''
        env:
          SEALED: ${{ inputs.sealed }}
          SEALED_SOURCE: ${{ inputs.sealed_source }}
          SEALED_ARCHIVE: ${{ secrets.HELDOUT_ARCHIVE_B64 }}
        run: |
          if [ "$SEALED_SOURCE" = test ]; then
            python3 tools/campaign/unseal.py "$SEALED" /tmp/sealed --from-file tools/campaign/cases/k7/test-archive.b64
          else
            python3 tools/campaign/unseal.py "$SEALED" /tmp/sealed --from-env SEALED_ARCHIVE
          fi
      - name: TF-A v2.12.0 with the EL3 read-back service (M7, m7/README.md)
        run: |
          git clone -q --depth 1 --branch v2.12.0 https://github.com/ARM-software/arm-trusted-firmware.git /opt/tfa
          git -C /opt/tfa apply "$GITHUB_WORKSPACE/tools/el3-readback/tf-a-v2.12.0-el3-readback.patch"
          make -C /opt/tfa -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu- PLAT=qemu QEMU_USE_GIC_DRIVER=QEMU_GICV3 \
            PRELOADED_BL33_BASE=0x80000000 EL3_READBACK=1 bl1 bl2 bl31 > /tmp/tfa-build.log 2>&1 ||
            { tail -40 /tmp/tfa-build.log; exit 1; }
          ls -l /opt/tfa/build/qemu/release/bl1.bin /opt/tfa/build/qemu/release/bl2.bin /opt/tfa/build/qemu/release/bl31.bin
      - name: QEMU 9.2 or later, and the unchanged tree builds (row K8)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          qemu-system-aarch64 --version | head -1
          python3 - <<'EOF'
          import re, subprocess, sys
          out = subprocess.run(["qemu-system-aarch64", "--version"], capture_output=True, text=True).stdout
          major, minor = map(int, re.search(r"version (\d+)\.(\d+)", out).groups())
          if (major, minor) < (9, 2):
              sys.exit(f"FAIL: QEMU {major}.{minor} is older than 9.2; no case runs")
          print(f"QEMU {major}.{minor}: 9.2 or later")
          EOF
          # the unchanged tree, as run_case.py builds it, output in the log
          src=$(mktemp -d) && git archive HEAD | tar -x -C "$src" && cd "$src"
          cmake --preset host-tests && cmake --build build-host
          cmake --preset arm64-qemu -DHAVEN_BOOT_PROFILE=qemu-direct && cmake --build build
          cmake --preset arm64-qemu -B build-psci -DHAVEN_BOOT_PROFILE=qemu-psci && cmake --build build-psci
          echo "the unchanged tree builds: host tests, qemu-direct, qemu-psci"
      - name: Run this shard's cases
        env:
          CASES: ${{ inputs.sealed != '' && '/tmp/sealed/cases.json' || inputs.cases }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          SCENARIO: ${{ inputs.scenario }}
        run: python3 tools/campaign/run_shard.py "$CASES" "$SHARD" "$SHARDS" out --scenario "$SCENARIO" --tfa /opt/tfa/build/qemu/release
      - uses: actions/upload-artifact@v4
        if: always() && inputs.sealed == ''
        with:
          name: cases-${{ matrix.shard }}
          path: out/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && inputs.sealed != ''
        with:
          name: cases-${{ matrix.shard }}
          path: out/*.json
          retention-days: 7

  # Scenario 2 (docs/methodology/stage2/20261119-evaluation-campaign/s2/):
  # the Linux-partition setup of ci.yml (pinned runner, KDAL, private SDK
  # kernel, kdal.ko) and SMP3's two-vCPU Linux boot with CPU hotplug, on the
  # pinned QEMU 8.2.2 (no SMMU stage 2, so the DMA grant is withheld).
  run-linux2:
    needs: plan
    if: inputs.scenario == 'linux2'
    name: linux2 shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Open the sealed archive (step C3)
        if: inputs.sealed != ''
        env:
          SEALED: ${{ inputs.sealed }}
          SEALED_SOURCE: ${{ inputs.sealed_source }}
          SEALED_ARCHIVE: ${{ secrets.HELDOUT_ARCHIVE_B64 }}
        run: |
          if [ "$SEALED_SOURCE" = test ]; then
            python3 tools/campaign/unseal.py "$SEALED" /tmp/sealed --from-file tools/campaign/cases/k7/test-archive.b64
          else
            python3 tools/campaign/unseal.py "$SEALED" /tmp/sealed --from-env SEALED_ARCHIVE
          fi
      - name: Pinned KDAL, SDK kernel, tools and kdal.ko
        id: lp
        uses: ./.github/actions/linux-partition
      - name: Run this shard's cases (scenario 2)
        env:
          CASES: ${{ inputs.sealed != '' && '/tmp/sealed/cases.json' || inputs.cases }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          IMAGE: ${{ steps.lp.outputs.image }}
        run: >-
          python3 tools/campaign/run_shard.py "$CASES" "$SHARD" "$SHARDS" out
          --scenario linux2 --image "$IMAGE" --kdal "$PWD/kdal" --ko "$PWD/kdal/kdal.ko"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.sealed == ''
        with:
          name: cases-${{ matrix.shard }}
          path: out/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && inputs.sealed != ''
        with:
          name: cases-${{ matrix.shard }}
          path: out/*.json
          retention-days: 7

  summary:
    needs: [run, run-linux2]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Open the sealed archive (step C3)
        if: inputs.sealed != ''
        env:
          SEALED: ${{ inputs.sealed }}
          SEALED_SOURCE: ${{ inputs.sealed_source }}
          SEALED_ARCHIVE: ${{ secrets.HELDOUT_ARCHIVE_B64 }}
        run: |
          if [ "$SEALED_SOURCE" = test ]; then
            python3 tools/campaign/unseal.py "$SEALED" /tmp/sealed --from-file tools/campaign/cases/k7/test-archive.b64
          else
            python3 tools/campaign/unseal.py "$SEALED" /tmp/sealed --from-env SEALED_ARCHIVE
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: cases-*
          path: out
          merge-multiple: true
      - name: Score
        env:
          CASES: ${{ inputs.sealed != '' && '/tmp/sealed/cases.json' || inputs.cases }}
        run: |
          python3 -c "import json,os; json.dump(json.load(open(os.environ['CASES'])).get('expect', {}), open('expect.json', 'w'))"
          python3 tools/campaign/score.py --expect expect.json --json report.json out/*.json | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c "import json,sys; d=json.load(open('report.json'))['disagreements']; sys.exit(1 if d else 0)"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.json
          retention-days: 14
