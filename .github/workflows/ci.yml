# GitHub Actions. Host unit tests on Linux, macOS and Windows (Windows is
# experimental: reported, not yet required); the ARM64 build, QEMU boot and
# partition checks on Linux.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # A pull request that changes only Markdown that no code reads skips the
  # build, boot and host-test jobs (scripts/ci/docs_only.py); pushes run
  # everything. "ci ok" is the one check the main branch's rule requires,
  # so skipped jobs need no names of their own.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.d.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/ci/docs_only.py "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
          else
            echo "code=true" | tee -a "$GITHUB_OUTPUT"
          fi

  host-tests:
    name: host unit tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # the job name keeps the label the protection rule requires; the Linux runner
    # is pinned to 24.04 (ubuntu-latest moved to 26.04, see the commit message)
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends cmake ninja-build gcc
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Configure and build
        run: |
          cmake --preset host-tests
          cmake --build build-host
      # bench_temporal_isolation has a known, undiagnosed timeout (recorded in
      # the Stage 1 evidence); it is excluded here until it is fixed.
      - name: Run tests
        run: ctest --test-dir build-host --output-on-failure --timeout 60 -E bench_temporal_isolation
      - name: Read-back grant formats and demand check (Python)
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} -m unittest discover -s tools/readback -p "test_*.py" -v
      - name: Firmware image scanners (Python)
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} -m unittest discover -s tools/fwscan -p "test_*.py" -v
      - name: Ecosystem pin checks (Python)
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} -m unittest discover -s scripts/ci -p "test_*.py" -v
      - name: Public release asset checks (Python)
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} -m unittest discover -s scripts/release -p "test_*.py" -v
      - name: Campaign tools (Python)
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} -m unittest discover -s tools/campaign -p "test_*.py" -v


  # The quality gate (docs/quality/gate.md): every tool at the version pinned
  # in quality/gate.json, the whole tree against quality/baseline.json.
  quality-gate:
    name: quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The gate's tools
        uses: ./.github/actions/gate-tools
        with:
          packages: gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu cloc
      - name: Gate unit tests
        run: python3 -m unittest discover -s tools/gate -p "test_*.py" -v
      # row K1 of docs/methodology/stage2/20261119-evaluation-campaign: the
      # mutant draw at case set v3's commit, fetched by the hash its record holds
      - name: Campaign K1 (case set v3's draw reproduced)
        run: |
          git fetch -q --depth=1 origin "$(python3 -c "import json; print(json.load(open('docs/methodology/stage2/20261102-a1-cases-v3/heldout-random/draw.json'))['haven_commit'])")"
          python3 -m unittest -v tools/campaign/test_mutate.py 2>&1 | tee /tmp/k1.log
          grep -q "test_k1_reproduces_case_set_v3 .* ok$" /tmp/k1.log
      - name: Quality gate (whole tree)
        run: scripts/gate ci --json gate-report.json

  arm64-qemu:
    name: ARM64 build and QEMU boot
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends \
            cmake ninja-build gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm
      - name: Cross-compile (qemu-direct profile)
        run: |
          cmake --preset arm64-qemu -DHAVEN_BOOT_PROFILE=qemu-direct
          cmake --build build
          file build/haven.elf | grep -q "ARM aarch64"
      - name: Boot in QEMU (cortex-a72)
        run: ./scripts/qemu/qemu-direct-check.sh build cortex-a72
      - name: Boot in QEMU (max)
        run: ./scripts/qemu/qemu-direct-check.sh build max
      # Partition B on CPU 2: QEMU's built-in PSCI starts it (qemu-psci).
      - name: Cross-compile (qemu-psci profile)
        run: |
          cmake --preset arm64-qemu -B build-psci -DHAVEN_BOOT_PROFILE=qemu-psci
          cmake --build build-psci
      - name: Partition B check (cortex-a72)
        run: python3 scripts/qemu/partition-b-check.py build-psci cortex-a72
      - name: Partition B check (max)
        run: python3 scripts/qemu/partition-b-check.py build-psci max
      # SOURCE_DATE_EPOCH is the HEAD commit time (cmake/reproducible.cmake):
      # a second build minutes later must give the same image.
      - name: Reproducibility (rebuild and compare haven.bin)
        run: |
          cmake --preset arm64-qemu -B build-repro -DHAVEN_BOOT_PROFILE=qemu-direct
          cmake --build build-repro
          cmp build/haven.bin build-repro/haven.bin
      # Draft CIX P1 platform: compile-only until a board exists
      # (docs/methodology/stage2/20261109-cix-p1-platform).
      - name: Cross-compile (cix-p1 draft, no boot)
        run: |
          cmake --preset arm64-cix-p1
          cmake --build build-cix-p1
          file build-cix-p1/haven.elf | grep -q "ARM aarch64"
      # Partition A's Linux layout on cix-p1 (D5). The device tree IPA is a
      # placeholder inside A's RAM for compiling, not a load decision.
      - name: Cross-compile (cix-p1 draft, Linux layout, no boot)
        run: |
          cmake --preset arm64-cix-p1 -B build-cix-p1-linux -DHAVEN_PART_A_DTB_IPA=0x110000000 -DHAVEN_PART_A_VCPUS=8
          cmake --build build-cix-p1-linux
      - name: UEFI probe and loader at EL2 in QEMU (L0, L1b)
        run: |
          sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends qemu-efi-aarch64
          boot/efi/build.sh build-efi
          file build-efi/*.efi
          scripts/qemu/uefi-probe-check.sh build-efi 180
          python3 scripts/qemu/uefi-boot-check.py build-psci build-efi cortex-a72
          python3 scripts/qemu/uefi-boot-check.py build-psci build-efi max
          python3 scripts/qemu/uefi-boot-check.py build-psci build-efi max 120 --seed mmu
          python3 scripts/qemu/uefi-boot-check.py build-psci build-efi max 120 --seed e2h

  # Partition B started through firmware: TF-A's CPU_ON re-initialises the
  # started CPU's redistributor, so HAVEN sets it up again on that CPU
  # (docs/methodology/stage2/20261122-firmware-redistributor/, rows F0, F2).
  partition-b-tfa:
    name: Partition B under TF-A (QEMU)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain, make and QEMU
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends \
            cmake ninja-build make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm
      - name: TF-A v2.12.0 with the EL3 read-back service
        run: |
          git clone -q --depth 1 --branch v2.12.0 https://github.com/ARM-software/arm-trusted-firmware.git "$RUNNER_TEMP/tfa"
          git -C "$RUNNER_TEMP/tfa" apply "$GITHUB_WORKSPACE/tools/el3-readback/tf-a-v2.12.0-el3-readback.patch"
          make -C "$RUNNER_TEMP/tfa" -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu- PLAT=qemu QEMU_USE_GIC_DRIVER=QEMU_GICV3 \
            PRELOADED_BL33_BASE=0x80000000 EL3_READBACK=1 bl1 bl2 bl31 > "$RUNNER_TEMP/tfa-build.log" 2>&1 ||
            { tail -40 "$RUNNER_TEMP/tfa-build.log"; exit 1; }
      - name: Cross-compile (qemu-tfa profile)
        run: |
          cmake --preset arm64-qemu -B build-tfa -DHAVEN_BOOT_PROFILE=qemu-tfa
          cmake --build build-tfa
      - name: Partition B check under TF-A (cortex-a72)
        run: python3 scripts/qemu/partition-b-check.py build-tfa cortex-a72 60 --tfa "$RUNNER_TEMP/tfa/build/qemu/release"
      - name: Partition B check under TF-A (max)
        run: python3 scripts/qemu/partition-b-check.py build-tfa max 60 --tfa "$RUNNER_TEMP/tfa/build/qemu/release"

  # Linux with KDAL in partition A on 2 and 3 vCPUs, partition B beside it
  # (docs/methodology/stage2/20261112-e4-ci-linux). Kernel: the pinned
  # private ELMOS SDK package; kdal.ko built against it at a pinned KDAL.
  # Every pin comes from ecosystem.lock.json (docs/methodology/stage2/
  # 20261113-e5-compat-manifest); runs-on is checked against it. The setup is
  # the linux-partition action, shared with linux-stress.yml
  # (docs/methodology/stage2/20261114-console-drain).
  linux-partition:
    name: Linux in partition A (QEMU, ELMOS SDK kernel)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Pinned KDAL, SDK kernel, tools and kdal.ko
        id: lp
        uses: ./.github/actions/linux-partition
      - name: Boot Linux in partition A (2 and 3 vCPUs)
        env:
          IMAGE: ${{ steps.lp.outputs.image }}
        run: |
          python3 docs/methodology/stage2/20261112-multi-vcpu-n/run_n.py "$PWD" "$PWD/kdal" \
            "$IMAGE" "$PWD/kdal/kdal.ko" build/linux-runs
          grep -h "DMA grant" build/linux-runs/N*/uart.log || true
      - name: Check the UART logs
        run: python3 scripts/qemu/linux-partition-check.py build/linux-runs
      - name: Show the UART logs on failure
        if: failure()
        run: for f in build/linux-runs/N*/uart.log; do echo "== $f"; tail -60 "$f"; done

  ci-ok:
    name: ci ok
    needs: [changes, host-tests, quality-gate, arm64-qemu, partition-b-tfa, linux-partition]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          bad = {j: n["result"] for j, n in json.loads(os.environ["RESULTS"]).items()
                 if n["result"] not in ("success", "skipped")}
          for j, r in sorted(bad.items()):
              print(f"{j}: {r}")
          sys.exit(1 if bad or json.loads(os.environ["RESULTS"])["changes"]["result"] != "success" else 0)
          PY
