# GitHub Actions. Host unit tests on Linux, macOS and Windows (Windows is
# experimental: reported, not yet required); the ARM64 build, QEMU boot and
# partition checks on Linux.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: host unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # the job name keeps the label the protection rule requires; the Linux runner
    # is pinned to 24.04 (ubuntu-latest moved to 26.04, see the commit message)
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends cmake ninja-build gcc
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Configure and build
        run: |
          cmake --preset host-tests
          cmake --build build-host
      # bench_temporal_isolation has a known, undiagnosed timeout (recorded in
      # the Stage 1 evidence); it is excluded here until it is fixed.
      - name: Run tests
        run: ctest --test-dir build-host --output-on-failure --timeout 60 -E bench_temporal_isolation
      - name: Read-back grant formats and demand check (Python)
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} -m unittest discover -s tools/readback -p "test_*.py" -v

  arm64-qemu:
    name: ARM64 build and QEMU boot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain and QEMU
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends \
            cmake ninja-build gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm
      - name: Cross-compile (qemu-direct profile)
        run: |
          cmake --preset arm64-qemu -DHAVEN_BOOT_PROFILE=qemu-direct
          cmake --build build
          file build/haven.elf | grep -q "ARM aarch64"
      - name: Boot in QEMU (cortex-a72)
        run: ./scripts/qemu/qemu-direct-check.sh build cortex-a72
      - name: Boot in QEMU (max)
        run: ./scripts/qemu/qemu-direct-check.sh build max
      # Partition B on CPU 2: QEMU's built-in PSCI starts it (qemu-psci).
      - name: Cross-compile (qemu-psci profile)
        run: |
          cmake --preset arm64-qemu -B build-psci -DHAVEN_BOOT_PROFILE=qemu-psci
          cmake --build build-psci
      - name: Partition B check (cortex-a72)
        run: python3 scripts/qemu/partition-b-check.py build-psci cortex-a72
      - name: Partition B check (max)
        run: python3 scripts/qemu/partition-b-check.py build-psci max
      # SOURCE_DATE_EPOCH is the HEAD commit time (cmake/reproducible.cmake):
      # a second build minutes later must give the same image.
      - name: Reproducibility (rebuild and compare haven.bin)
        run: |
          cmake --preset arm64-qemu -B build-repro -DHAVEN_BOOT_PROFILE=qemu-direct
          cmake --build build-repro
          cmp build/haven.bin build-repro/haven.bin
      # Draft CIX P1 platform: compile-only until a board exists
      # (docs/methodology/stage2/20261109-cix-p1-platform).
      - name: Cross-compile (cix-p1 draft, no boot)
        run: |
          cmake --preset arm64-cix-p1
          cmake --build build-cix-p1
          file build-cix-p1/haven.elf | grep -q "ARM aarch64"
      # Partition A's Linux layout on cix-p1 (D5). The device tree IPA is a
      # placeholder inside A's RAM for compiling, not a load decision.
      - name: Cross-compile (cix-p1 draft, Linux layout, no boot)
        run: |
          cmake --preset arm64-cix-p1 -B build-cix-p1-linux -DHAVEN_PART_A_DTB_IPA=0x110000000 -DHAVEN_PART_A_VCPUS=8
          cmake --build build-cix-p1-linux

  # Linux with KDAL in partition A on 2 and 3 vCPUs, partition B beside it
  # (docs/methodology/stage2/20261112-e4-ci-linux). Kernel: the pinned
  # private ELMOS SDK package; kdal.ko built against it at a pinned KDAL.
  # Every pin comes from ecosystem.lock.json (docs/methodology/stage2/
  # 20261113-e5-compat-manifest); runs-on is checked against it.
  linux-partition:
    name: Linux in partition A (QEMU, ELMOS SDK kernel)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Pins from ecosystem.lock.json
        id: pins
        run: |
          python3 scripts/ci/ecosystem.py check-workflow .github/workflows/ci.yml
          python3 scripts/ci/ecosystem.py outputs | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.kdal_repository }}
          ref: ${{ steps.pins.outputs.kdal_commit }}
          path: kdal
      - uses: oras-project/setup-oras@v2
      - name: Pull the pinned ELMOS SDK kernel by digest (private package)
        env:
          SDK_REF: ${{ steps.pins.outputs.sdk_ref }}
          SDK_TAG: ${{ steps.pins.outputs.sdk_tag }}
          SDK_DIGEST: ${{ steps.pins.outputs.sdk_digest }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          trap 'oras logout ghcr.io' EXIT
          got=$(oras resolve "$SDK_TAG")
          [ "$got" = "$SDK_DIGEST" ] || { echo "FAIL: $SDK_TAG resolves to $got, pinned $SDK_DIGEST"; exit 1; }
          mkdir -p build/sdk
          oras pull "$SDK_REF" -o build/sdk
          python3 scripts/ci/ecosystem.py check-sdk build/sdk
          python3 -c 'import json;m=json.load(open("build/sdk/manifest.json"));print("SDK", m["linux"]["version_string"], "elmos", m["elmos_commit"], "run", m["run"])'
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends \
            cmake ninja-build gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-system-arm device-tree-compiler clang lld llvm make bc flex bison \
            libelf-dev libssl-dev xz-utils curl
          python3 scripts/ci/ecosystem.py check-qemu "$(qemu-system-aarch64 --version | head -1)"
      - name: Prepare the SDK kernel and build kdal.ko (pinned KDAL)
        run: |
          set -o pipefail
          kdal/scripts/ci/kernel-prepare.sh "$PWD/build/sdk" | tail -2 > build/kpaths
          make -C "$(sed -n 1p build/kpaths)" M="$PWD/kdal" ARCH=arm64 LLVM=1 modules > build/kdal-build.log 2>&1 ||
            { tail -30 build/kdal-build.log; exit 1; }
          modinfo -F vermagic kdal/kdal.ko
      - name: Boot Linux in partition A (2 and 3 vCPUs)
        run: |
          python3 docs/methodology/stage2/20261112-multi-vcpu-n/run_n.py "$PWD" "$PWD/kdal" \
            "$(sed -n 2p build/kpaths)" "$PWD/kdal/kdal.ko" build/linux-runs
          grep -h "DMA grant" build/linux-runs/N*/uart.log || true
      - name: Check the UART logs
        run: python3 scripts/qemu/linux-partition-check.py build/linux-runs
      - name: Show the UART logs on failure
        if: failure()
        run: for f in build/linux-runs/N*/uart.log; do echo "== $f"; tail -60 "$f"; done
