# The R1 demo bundle: every scene's inputs, built and checked by CI, on
# demand only (docs/methodology/stage2/20261115-r1-demo-bundle). build makes
# the bundle with the linux-partition setup (pinned SDK kernel, kdal.ko),
# runs scene D from it on Ubuntu's QEMU and pushes it as a PRIVATE GHCR
# package (working rule 2: it holds the private SDK kernel), then checks
# that an anonymous fetch is refused. test-macos pulls it by digest and
# runs scenes A to C (the published try release) and scene D with
# Homebrew's QEMU, the one the live demo uses; summary lists both results.
# Nothing here creates a release or uploads an Actions artifact.
name: r1-demo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Package tag, r1-demo-YYYYMMDD or r1-demo-YYYYMMDD.N
        required: true
      try-tag:
        description: The published try release for scenes A to C
        required: true
        default: try-20261115.1

permissions:
  contents: read

env:
  PACKAGE: ghcr.io/nguyentrongphuc552003/haven-r1-demo

jobs:
  build:
    name: build the bundle; scene D on Ubuntu's QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      scene-d: ${{ steps.scene.outputs.summary }}
    env:
      TAG: ${{ inputs.tag }}
      TRY_TAG: ${{ inputs.try-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - name: The tag's form
        run: |
          [[ "$TAG" =~ ^r1-demo-[0-9]{8}(\.[0-9]+)?$ ]] || { echo "FAIL: '$TAG' is not r1-demo-YYYYMMDD[.N]"; exit 1; }
      - name: Pinned KDAL, SDK kernel, tools and kdal.ko
        id: lp
        uses: ./.github/actions/linux-partition
      - name: The try bundle of scenes A to C (D1)
        run: |
          mkdir -p build/try
          gh release download "$TRY_TAG" -R "$GITHUB_REPOSITORY" -p '*.tar.gz' -p SHA256SUMS -D build/try
          (cd build/try && sha256sum -c SHA256SUMS)
      - name: Build the bundle (D1)
        env:
          IMAGE: ${{ steps.lp.outputs.image }}
        run: |
          python3 scripts/release/make-demo-bundle.py "$PWD" "$PWD/kdal" "$IMAGE" "$PWD/kdal/kdal.ko" \
            build/try/haven-try-*.tar.gz dist | tee build/bundle-path
          ls -l dist
          (cd dist && f=$(basename "$(cat ../build/bundle-path)") && sha256sum "$f" > "$f.sha256")
          mkdir -p build/unpacked && tar -xzf dist/*.tar.gz -C build/unpacked
          (cd build/unpacked/* && sha256sum -c --quiet MANIFEST.sha256 && echo "MANIFEST: $(wc -l < MANIFEST.sha256) files OK")
      - name: Scene D from the bundle, Ubuntu's QEMU (D2)
        id: scene
        run: |
          set -o pipefail
          python3 build/unpacked/*/run-scene-d.py build/scene-d | tee build/scene-d.log
          echo "summary=$(qemu-system-aarch64 --version | head -1): $(grep -E '^N = [23]: (OK|FAIL)' build/scene-d.log | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Show the UART logs on failure
        if: failure()
        run: for f in build/scene-d/N*/uart.log; do echo "== $f"; tail -40 "$f"; done
      - name: Publish (private GHCR package) (D8)
        id: push
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'oras logout ghcr.io' EXIT
          if oras manifest fetch "$PACKAGE:$TAG" > /dev/null 2>&1; then
            echo "FAIL: $PACKAGE:$TAG exists"; exit 1
          fi
          cd dist
          oras push "$PACKAGE:$TAG" \
            --artifact-type application/vnd.haven.r1-demo.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            ./*.tar.gz ./*.tar.gz.sha256
          digest=$(oras resolve "$PACKAGE:$TAG")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published $PACKAGE:$TAG at $digest"
      - name: Privacy check, anonymous fetch must be refused (D9)
        run: |
          oras logout ghcr.io 2>/dev/null || true
          if oras manifest fetch "$PACKAGE:$TAG" > /dev/null 2>&1; then
            echo "FAIL: the package can be fetched without credentials: it is public" >&2
            exit 1
          fi
          echo "anonymous fetch refused, as expected"

  test-macos:
    name: every scene on macOS (Homebrew's QEMU)
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      try: ${{ steps.t.outputs.summary }}
      qemu: ${{ steps.t.outputs.qemu }}
      scene-d: ${{ steps.d.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: QEMU and dtc
        run: brew install qemu dtc
      - name: The try release's id
        id: try
        env:
          GH_TOKEN: ${{ github.token }}
          TRY_TAG: ${{ inputs.try-tag }}
        run: echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TRY_TAG" -q .id)" >> "$GITHUB_OUTPUT"
      - name: Scenes A to C (D3)
        id: t
        uses: ./.github/actions/try-bundle-test
        with:
          release-id: ${{ steps.try.outputs.id }}
          strict-dma: "true"
      - uses: oras-project/setup-oras@v2
      - name: Scene D from the package, pulled by digest (D4)
        id: d
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -o pipefail
          mkdir -p demo-assets demo
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          oras pull "$PACKAGE@$DIGEST" -o demo-assets
          oras logout ghcr.io
          (cd demo-assets && shasum -a 256 -c ./*.sha256)
          tar -xzf demo-assets/*.tar.gz -C demo
          (cd demo/* && shasum -a 256 -c --quiet MANIFEST.sha256)
          python3 demo/*/run-scene-d.py "$PWD/scene-d" | tee scene-d.log
          echo "summary=$(grep -E '^N = [23]: (OK|FAIL)' scene-d.log | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Show the UART logs on failure
        if: failure()
        run: for f in scene-d/N*/uart.log; do echo "== $f"; tail -40 "$f"; done

  summary:
    name: both results in the run's summary
    needs: [build, test-macos]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - env:
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ needs.build.outputs.digest }}
          LINUX_D: ${{ needs.build.outputs.scene-d }}
          MAC: ${{ needs.test-macos.result }}
          MAC_QEMU: ${{ needs.test-macos.outputs.qemu }}
          MAC_TRY: ${{ needs.test-macos.outputs.try }}
          MAC_D: ${{ needs.test-macos.outputs.scene-d }}
        run: |
          printf '%s\n' "# R1 demo bundle $TAG" "" "Private package $PACKAGE:$TAG ($DIGEST), built from $GITHUB_SHA." "" \
            "- Ubuntu, scene D: ${LINUX_D:-no output}" \
            "- macOS (${MAC_QEMU:-?}), $MAC: scenes A to C: ${MAC_TRY:-no output}; scene D: ${MAC_D:-no output}" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$MAC" = success ]
