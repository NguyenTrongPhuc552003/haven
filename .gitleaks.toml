# gitleaks configuration for the quality gate (docs/quality/gate.md): the
# default rules, without the files that only look like secrets: the gate's
# baseline (finding keys are hex hashes), its tests (a token built at run
# time) and build or cache output that is not tracked.
[extend]
useDefault = true

[allowlist]
description = "gate baseline, gate tests, untracked build and cache output"
paths = [
  '''^quality/baseline\.json$''',
  '''^tools/gate/test_gate\.py$''',
  '''(^|/)__pycache__/''',
  '''(^|/)build[^/]*/''',
]
